<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Smartwatch with a light colored loop band">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#ece9e0" />
      <stop offset="1" stop-color="#c9c6bd" />
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c3e33" />
      <stop offset="1" stop-color="#1b1d17" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181b13" />
      <stop offset="1" stop-color="#040503" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Watch ke peeche halki roshni -->
  <circle cx="340" cy="320" r="255" fill="url(#glow)" />

  <!-- Zameen par soft shadow -->
  <ellipse cx="340" cy="345" rx="200" ry="235" fill="#000000" fill-opacity="0.26" filter="url(#softShadow)" />

  <!-- Loop band: bada safaid chhalla jo watch ke peeche se guzarta hai -->
  <g transform="rotate(-20 340 320)">
    <ellipse cx="340" cy="320" rx="168" ry="205" fill="none" stroke="url(#band)" stroke-width="74" />
    <ellipse cx="340" cy="320" rx="168" ry="205" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
    <ellipse cx="340" cy="320" rx="204" ry="241" fill="none" stroke="#000000" stroke-opacity="0.12" stroke-width="2" />
  </g>

  <!-- Watch case -->
  <g transform="rotate(-8 312 332)">
    <!-- case -->
    <rect x="207" y="201" width="210" height="262" rx="62" fill="url(#case)" stroke="#5b5d4a" stroke-width="2" />
    <!-- screen -->
    <rect x="225" y="219" width="174" height="226" rx="50" fill="url(#screen)" />
    <!-- screen par halki chamak -->
    <path d="M236 268c26-34 68-48 112-43 30 3 46 14 53 23-44-16-119-9-165 20Z" fill="#ffffff" fill-opacity="0.06" />
    <!-- digital crown -->
    <rect x="417" y="278" width="17" height="54" rx="8.5" fill="#6a6c55" />
    <rect x="420" y="290" width="11" height="30" rx="5.5" fill="#87896e" />
    <!-- side button -->
    <rect x="417" y="352" width="10" height="36" rx="5" fill="#4c4e3d" />

    <!-- time -->
    <text x="312" y="338" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="60" font-weight="300" fill="#f4f1e6">10:09</text>

    <!-- activity ring -->
    <circle cx="312" cy="384" r="27" fill="none" stroke="#2b2d22" stroke-width="8" />
    <circle cx="312" cy="384" r="27" fill="none" stroke="#b9e34f" stroke-width="8" stroke-linecap="round" stroke-dasharray="122 170" transform="rotate(-90 312 384)" />
  </g>

  <!-- Gold sparkles -->
  <path d="M140 108 L151 150 L193 161 L151 172 L140 214 L129 172 L87 161 L129 150 Z" fill="#e8c98c" fill-opacity="0.95" />
  <path d="M534 108 L540 130 L562 136 L540 142 L534 164 L528 142 L506 136 L528 130 Z" fill="#e8c98c" fill-opacity="0.8" />
  <circle cx="520" cy="252" r="4" fill="#e8c98c" fill-opacity="0.7" />
  <circle cx="556" cy="304" r="2.5" fill="#e8c98c" fill-opacity="0.5" />
</svg>
